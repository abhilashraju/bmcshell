server.port=8443
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-password=q1
server.ssl.key-store-type=PKCS12
security.require-ssl=true

server.netty.max-initial-line-length=4096
server.netty.max-header-size=8192
server.netty.max-chunk-size=8192
server.netty.max-frame-size=16384
# SSE streams are idle by design; disable read-timeout so Netty does not
# drop long-lived SSE connections.
spring.netty.read-timeout=0

# Suppress noisy Netty / Reactor client stack traces on console/ws connection failures
logging.level.reactor.netty.http.client=ERROR
logging.level.reactor.netty.channel=ERROR
logging.level.io.netty=WARN
logging.level.com.ibm.bmcshell.console=WARN

# ── Firmware update server ──────────────────────────────────────────────────
# Directory on the bmcshell host where firmware binaries are stored.
# The fw_updater daemon on the BMC will poll /firmware/catalogue.json and
# download binaries from /firmware/images/<filename>.
firmware.store.dir=./firmware-store
# Base URL bmcshell advertises in imageUrl catalogue entries.
# Must be reachable from the BMC (change host/port to match your setup).
firmware.server.baseUrl=https://localhost:8443

# Allow firmware images up to 512 MB (BMC images are typically 200-300 MB)
spring.servlet.multipart.max-file-size=512MB
spring.servlet.multipart.max-request-size=512MB

# firmware.server.baseUrl is no longer needed — imageUrl is derived from the
# incoming request (scheme://host:port) so it always reflects the actual
# address the BMC used to reach bmcshell.
